<!DOCTYPE html>
<html>
<head>
    <title>Conference Scraper</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
            background: #f5f6fa;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
        }

        .grid {
            display: flex;
            gap: 20px;
        }

        .grid .card {
            flex: 1;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        .btn {
            padding: 8px 12px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .filters {
            margin-bottom: 15px;
        }

        input, select {
            padding: 6px;
            margin-right: 10px;
        }

        .pagination {
            margin-top: 15px;
        }

        .pagination a {
            margin: 0 5px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="navbar">
            <h2>Conference Dashboard</h2>
            <div>
                <a href="/" class="btn">Dashboard</a>
                <a href="/list/" class="btn">View Data</a>
            </div>
        </div>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
